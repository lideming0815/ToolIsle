name: ToolIsle grouped Issues and compact tag filters
on:
  push:
    branches: [feat/gitee-grouped-labels]
    paths: [.github/workflows/toolisle-gitee-labels.yml]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: toolisle-gitee-labels-preview
  cancel-in-progress: true
jobs:
  apply-scoped-patch:
    runs-on: ubuntu-latest
    if: github.repository == 'lideming0815/ToolIsle' && github.ref == 'refs/heads/feat/gitee-grouped-labels'
    permissions:
      contents: write
    outputs:
      source: ${{ steps.finalize.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: finalize
        name: Finalize checksummed continuation as a normal commit
        run: |
          set -euo pipefail
          if [ -f scripts/gitee-labels-finish.b64 ]; then
            python3 - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          encoded=Path('scripts/gitee-labels-finish.b64').read_text()
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='18ec26fc80ba0eb1245d08fd7d3abe257d002829562090852a3b79bbc54d84cb'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
            git rm scripts/gitee-labels-finish.b64
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test(gitee): keep native view inspection and WebKit readiness on main actor'
            git push origin HEAD:refs/heads/feat/gitee-grouped-labels
          fi
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  macos:
    needs: apply-scoped-patch
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ needs.apply-scoped-patch.outputs.source }}
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Audit source scope and production layout rules
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.apply-scoped-patch.outputs.source }}"
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/gitee-fix-output"
          python3 - <<'PY' | tee "$RUNNER_TEMP/gitee-fix-output/labels-scope-audit.json"
          import subprocess,hashlib,json
          from pathlib import Path
          base='1e7ea32073f4513f18dccccb3c2ef7aac6b776bc'
          allowed={'DynamicIsland.xcodeproj/project.pbxproj','DynamicIsland/ToolIsleFeatures/Gitee/GICore.swift','DynamicIsland/ToolIsleFeatures/Gitee/GIViews.swift','DynamicIsland/ToolIsleFeatures/Gitee/GIStore.swift','DynamicIsland/ToolIsleFeatures/Gitee/GIReaderControls.swift'}
          count=0
          for path in subprocess.check_output(['git','ls-tree','-r','--name-only',base],text=True).splitlines():
              if path in allowed:continue
              p=Path(path);expected=subprocess.check_output(['git','show',base+':'+path]);actual=str(p.readlink()).encode() if p.is_symlink() else p.read_bytes()
              if expected.startswith(b'version https://git-lfs'):
                  fields=dict(x.split(' ',1) for x in expected.decode().strip().splitlines());assert len(actual)==int(fields['size']) and hashlib.sha256(actual).hexdigest()==fields['oid'].split(':')[1],path
              else:assert actual==expected,path
              count+=1
          controls=Path('DynamicIsland/ToolIsleFeatures/Gitee/GIReaderControls.swift').read_text()
          assert 'GICopyIssueButton' not in controls.split('struct GIIssueRow:')[1]
          assert 'private var project:' not in controls and 'Picker(' not in controls
          assert 'GIStatusFilters()' in controls and 'GILabelFilters()' in controls
          view=Path('DynamicIsland/ToolIsleFeatures/Gitee/GIViews.swift').read_text()
          header=view.split('private var header:')[1].split('@ViewBuilder private var detail:')[0]
          assert header.index('textformat.size')<header.index('GICopyIssueButton')<header.index('arrow.clockwise')
          print(json.dumps({'base':base,'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'unchanged_baseline_files':count,'allowed_existing_files':sorted(allowed),'list_copy_icon':False,'window_lifecycle_notch_metrics_and_markdown_unchanged':True},indent=2))
          PY
          python3 -m unittest tests.test_gitee_reader_lifecycle 2>&1 | tee "$RUNNER_TEMP/gitee-fix-output/ux-lifecycle-structural-tests.txt"
          swiftc DynamicIsland/ToolIsleFeatures/Gitee/GINotchMetrics.swift tests/GiteeUXMetricsRegression.swift -o "$RUNNER_TEMP/GiteeUXMetricsRegression"
          "$RUNNER_TEMP/GiteeUXMetricsRegression" | tee "$RUNNER_TEMP/gitee-fix-output/ux-metrics-tests.txt"
          swiftc DynamicIsland/ToolIsleFeatures/Gitee/GICore.swift DynamicIsland/ToolIsleFeatures/Gitee/GIListPresentation.swift tests/GiteeLabelsRegression.swift -o "$RUNNER_TEMP/GiteeLabelsRegression"
          "$RUNNER_TEMP/GiteeLabelsRegression" | tee "$RUNNER_TEMP/gitee-fix-output/labels-core-tests.txt"
          swiftc tests/GiteeActivationDriver.swift -o "$RUNNER_TEMP/GiteeActivationDriver"
      - name: Render unchanged production notch in both appearances
        run: OUT="$RUNNER_TEMP/gitee-fix-output" python3 tests/render_gitee_notch.py | tee "$RUNNER_TEMP/gitee-fix-output/ux-appearance-tests.txt"
      - name: Build original Release target and retain previous regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/build_gitee_settings_preview.sh').read_text().replace('1640','1643').replace('gitee.2','gitee.5').replace('TOOLISLE-GITEE-SETTINGS-FIX.md','TOOLISLE-GITEE-LABELS.md')
          s=s.replace('No user credentials are provided to this public CI. Local direct requests failed DNS resolution before reaching Gitee.','No live Gitee credentials are provided; only explicit synthetic fixtures are exercised.')
          Path('scripts/.build_labels_preview.sh').write_text(s)
          PY
          bash scripts/.build_labels_preview.sh
          rm scripts/.build_labels_preview.sh
      - name: Verify previous native UX regressions twice and new label UI
        run: |
          python3 - <<'PY'
          import os,json,subprocess,time
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'gitee-fix-output';binary=Path(os.environ['RUNNER_TEMP'])/'ToolIsleGiteeFix/ToolIsle.app/Contents/MacOS/ToolIsle'
          runs=[]
          for name,flag,key,resultName in [('ux-runtime-1','--gitee-ux-probe','TOOLISLE_GITEE_UX_RESULT','ux-runtime.json'),('ux-runtime-2','--gitee-ux-probe','TOOLISLE_GITEE_UX_RESULT','ux-runtime.json'),('label-ui','--gitee-label-probe','TOOLISLE_LABEL_RESULT','labels-ui.json')]:
              folder=out/name;folder.mkdir();result=folder/resultName
              env=os.environ.copy();env[key]=str(result);env['TOOLISLE_GITEE_FOCUS_DRIVER']=str(Path(os.environ['RUNNER_TEMP'])/'GiteeActivationDriver')
              record={'name':name,'passed':False}
              with (folder/'runtime.log').open('w') as log:
                  p=subprocess.Popen([str(binary),'--gitee-reader-demo',flag,'-SUEnableAutomaticChecks','NO'],env=env,stdout=log,stderr=subprocess.STDOUT)
                  try:
                      for _ in range(150):
                          if result.exists() or p.poll() is not None:break
                          time.sleep(1)
                      subprocess.run(['/usr/sbin/screencapture','-x',str(folder/'desktop.png')],check=False)
                      assert result.exists(),'Native runtime report missing'
                      data=json.loads(result.read_text());print(json.dumps(data,ensure_ascii=False,indent=2))
                      assert data['passed'] and not data['failures'] and len(data['checks'])>0,data
                      assert data['synthetic_data'] and not data['live_gitee_tested'] and not data['third_party_alttab_hotkey_tested']
                      if flag=='--gitee-ux-probe':
                          assert len(data['checks'])>=66,data
                          assert len(data['activation_runs'])==2 and all(a.get('native_cmd_tab_tested') and a.get('native_cmd_tab_returned_to_reader') and not a.get('error') for a in data['activation_runs'])
                      record.update(passed=True,checks=len(data['checks']))
                  except Exception as error:record['error']=str(error)
                  finally:
                      if p.poll() is None:
                          p.terminate()
                          try:p.wait(timeout=10)
                          except subprocess.TimeoutExpired:p.kill();p.wait()
              runs.append(record)
          summary={'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'updater_override':'process-only -SUEnableAutomaticChecks NO','production_updater_defaults_modified':False,'runs':runs,'passed':all(r['passed'] for r in runs)}
          (out/'labels-runtime-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2));assert summary['passed'],summary
          PY
      - name: Verify archive bytes and hydrate source media
        run: |
          python3 - <<'PY'
          import os,zipfile,hashlib
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'gitee-fix-output';source=out/'ToolIsle-gitee.5-source.zip';hydrated=out/'hydrated-source.zip'
          media=[]
          with zipfile.ZipFile(source) as src, zipfile.ZipFile(hydrated,'w',zipfile.ZIP_DEFLATED) as dst:
              for info in src.infolist():
                  data=src.read(info)
                  if data.startswith(b'version https://git-lfs'):
                      relative=info.filename.removeprefix('ToolIsle-gitee-fix/');fields=dict(x.split(' ',1) for x in data.decode().strip().splitlines());data=Path(relative).read_bytes()
                      assert len(data)==int(fields['size']) and hashlib.sha256(data).hexdigest()==fields['oid'].split(':')[1],relative
                      media.append(relative)
                  dst.writestr(info,data)
          hydrated.replace(source)
          for p in out.glob('*.zip'):
              with zipfile.ZipFile(p) as z:assert z.testzip() is None and len(z.namelist())==len(set(z.namelist())),p
          (out/'source-media.txt').write_text('\n'.join(media)+'\n')
          (out/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.suffix in {'.dmg','.zip'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolisle-gitee-labels-preview
          path: ${{ runner.temp }}/gitee-fix-output/
          retention-days: 14
          if-no-files-found: error
