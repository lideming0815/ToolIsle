name: ToolIsle Gitee UX and window lifecycle
on:
  push:
    branches: [fix/gitee-reader-window-ux]
    paths: [.github/workflows/toolisle-gitee-ux.yml]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: toolisle-gitee-ux-preview
  cancel-in-progress: false
jobs:
  macos:
    if: github.repository == 'lideming0815/ToolIsle' && github.ref == 'refs/heads/fix/gitee-reader-window-ux'
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.sha }}
      - name: Finalize scoped source edits as a normal reviewable commit
        run: |
          set -euo pipefail
          if [ -f scripts/finalize_gitee_ux.py ]; then
            python3 scripts/finalize_gitee_ux.py
            git rm scripts/finalize_gitee_ux.py
            git add DynamicIsland
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(gitee): restore original tab geometry and complete non-reentrant reader lifecycle'
            git push origin HEAD:refs/heads/fix/gitee-reader-window-ux
          fi
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Audit scope and exercise production sizing
        run: |
          mkdir -p "$RUNNER_TEMP/gitee-fix-output"
          python3 - <<'PY' | tee "$RUNNER_TEMP/gitee-fix-output/ux-scope-audit.json"
          import subprocess,json,hashlib
          from pathlib import Path
          base='60bf67dfa3109c90257c1cdd780a56e3b26e8e07'
          allowed={'DynamicIsland.xcodeproj/project.pbxproj','DynamicIsland/ContentView.swift','DynamicIsland/DynamicIslandApp.swift','DynamicIsland/models/DynamicIslandViewModel.swift','DynamicIsland/components/Settings/SettingsWindowController.swift','DynamicIsland/components/Webcam/WebcamView.swift','DynamicIsland/ToolIsleFeatures/Gitee/GIViews.swift','DynamicIsland/ToolIsleFeatures/Gitee/GIStore.swift','DynamicIsland/ToolIsleFeatures/Gitee/GISettingsView.swift','tests/render_gitee_notch.py'}
          count=0
          for path in subprocess.check_output(['git','ls-tree','-r','--name-only',base]).decode().splitlines():
              if path in allowed:continue
              p=Path(path);expected=subprocess.check_output(['git','show',base+':'+path])
              actual=str(p.readlink()).encode() if p.is_symlink() else p.read_bytes()
              if expected.startswith(b'version https://git-lfs'):
                  fields=dict(x.split(' ',1) for x in expected.decode().strip().splitlines())
                  assert len(actual)==int(fields['size']) and hashlib.sha256(actual).hexdigest()==fields['oid'].split(':')[1],path
              else:assert actual==expected,path
              count+=1
          s=Path('DynamicIsland/ToolIsleFeatures/Gitee/GIViews.swift').read_text()
          notch=s[s.index('struct GINotchView:'):s.index('struct GIReaderRootView:')]
          assert 'GICopyIssueButton' not in notch and 'GIPasteboard' not in notch
          assert '.environment(\\.colorScheme, .dark)' in notch
          assert 'layout.contentHeight' in notch and 'layout.metrics.limit' in notch
          print(json.dumps({'base':base,'source':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),'unchanged_baseline_files':count,'allowed_existing_files':sorted(allowed),'notch_copy_button':False,'gitee_api_and_markdown_unchanged':True},indent=2))
          PY
          python3 -m unittest tests.test_gitee_reader_lifecycle 2>&1 | tee "$RUNNER_TEMP/gitee-fix-output/ux-lifecycle-structural-tests.txt"
          swiftc DynamicIsland/ToolIsleFeatures/Gitee/GINotchMetrics.swift tests/GiteeUXMetricsRegression.swift -o "$RUNNER_TEMP/GiteeUXMetricsRegression"
          "$RUNNER_TEMP/GiteeUXMetricsRegression" | tee "$RUNNER_TEMP/gitee-fix-output/ux-metrics-tests.txt"
          swiftc tests/GiteeActivationDriver.swift -o "$RUNNER_TEMP/GiteeActivationDriver"
      - name: Render actual production notch in both appearances and ten data states
        run: |
          OUT="$RUNNER_TEMP/gitee-fix-output" python3 tests/render_gitee_notch.py | tee "$RUNNER_TEMP/gitee-fix-output/ux-appearance-tests.txt"
      - name: Build original Release target and package with existing regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/build_gitee_settings_preview.sh').read_text()
          s=s.replace('1640','1642').replace('gitee.2','gitee.4').replace('TOOLISLE-GITEE-SETTINGS-FIX.md','TOOLISLE-GITEE-UX-FIX.md')
          s=s.replace('No user credentials are provided to this public CI. Local direct requests failed DNS resolution before reaching Gitee.','No user credentials are provided to this public CI; only synthetic fixtures are exercised.')
          Path('scripts/.build_ux_preview.sh').write_text(s)
          PY
          bash scripts/.build_ux_preview.sh
          rm scripts/.build_ux_preview.sh
      - name: Verify actual settings round-trip, cross-process activation, copy and native notch sizes
        run: |
          python3 - <<'PY'
          import os,json,subprocess,time
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'gitee-fix-output'
          binary=Path(os.environ['RUNNER_TEMP'])/'ToolIsleGiteeFix/ToolIsle.app/Contents/MacOS/ToolIsle'
          result=out/'ux-runtime.json'
          env=os.environ.copy();env['TOOLISLE_GITEE_UX_RESULT']=str(result)
          env['TOOLISLE_GITEE_FOCUS_DRIVER']=str(Path(os.environ['RUNNER_TEMP'])/'GiteeActivationDriver')
          with (out/'ux-runtime.log').open('w') as log:
              p=subprocess.Popen([str(binary),'--gitee-reader-demo','--gitee-ux-probe'],env=env,stdout=log,stderr=subprocess.STDOUT)
              try:
                  for _ in range(120):
                      if result.exists() or p.poll() is not None:break
                      time.sleep(1)
                  subprocess.run(['/usr/sbin/screencapture','-x',str(out/'ux-final-desktop.png')],check=False)
                  if not result.exists() and p.poll() is None:
                      subprocess.run(['/usr/bin/sample',str(p.pid),'3','-file',str(out/'ux-hang-sample.txt')],timeout=15,check=False)
                  print((out/'ux-runtime.log').read_text())
                  assert result.exists(),'runtime probe missing; inspect log and screenshot'
                  data=json.loads(result.read_text());print(json.dumps(data,ensure_ascii=False,indent=2))
                  assert data['passed'],data
              finally:
                  if p.poll() is None:
                      p.terminate()
                      try:p.wait(timeout=10)
                      except subprocess.TimeoutExpired:p.kill();p.wait()
          PY
      - name: Verify archive payloads and refresh checksums
        run: |
          python3 - <<'PY'
          import os,zipfile,hashlib
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'gitee-fix-output'
          source=out/'ToolIsle-gitee.4-source.zip'
          hydrated=out/'hydrated-source.zip'
          media=[]
          with zipfile.ZipFile(source) as src, zipfile.ZipFile(hydrated,'w',zipfile.ZIP_DEFLATED) as dst:
              for info in src.infolist():
                  data=src.read(info)
                  if data.startswith(b'version https://git-lfs'):
                      relative=info.filename.removeprefix('ToolIsle-gitee-fix/')
                      fields=dict(x.split(' ',1) for x in data.decode().strip().splitlines())
                      data=Path(relative).read_bytes()
                      assert len(data)==int(fields['size']) and hashlib.sha256(data).hexdigest()==fields['oid'].split(':')[1],relative
                      media.append(relative)
                  dst.writestr(info,data)
          hydrated.replace(source)
          for p in out.glob('*.zip'):
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None,p
                  assert len(z.namelist())==len(set(z.namelist())),p
          (out/'source-media.txt').write_text('\n'.join(media)+'\n')
          (out/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.suffix in {'.dmg','.zip'}))
          PY
      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/gitee-fix-output"
          find ~/Library/Logs/DiagnosticReports -maxdepth 1 \( -iname '*ToolIsle*' -o -iname '*Atoll*' \) -exec cp {} "$RUNNER_TEMP/gitee-fix-output/" \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolisle-gitee-ux-preview
          path: ${{ runner.temp }}/gitee-fix-output/
          retention-days: 14
          if-no-files-found: error
