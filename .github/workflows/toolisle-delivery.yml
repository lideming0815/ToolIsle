name: ToolIsle Delivery
on:
  push:
    branches: [dev, feat/toolisle-foundation]
    paths: ['ToolIsle/**', 'scripts/*toolisle*', 'Package.*', '.github/workflows/toolisle-delivery.yml']
  pull_request:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: toolisle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Apply verified finalization patch on feature branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/toolisle-foundation'
        run: |
          if [ -f scripts/toolisle-hardening.patch ]; then
            git apply --check scripts/toolisle-hardening.patch
            git apply scripts/toolisle-hardening.patch
            rm scripts/toolisle-hardening.patch
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add ToolIsle scripts/toolisle-hardening.patch
            git commit -m 'fix: isolate in-flight account requests and document resource refs'
            git push origin HEAD:feat/toolisle-foundation
          fi
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: git archive --format=tar.gz -o /tmp/ToolIsle-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ToolIsle-source
          path: /tmp/ToolIsle-source.tar.gz
          retention-days: 14
  core-tests:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - run: swift --version && swift test
  macos-build:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - run: xcodebuild -version && swift --version
      - name: Test and package
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/toolisle-tests.log
          bash scripts/build-toolisle.sh release 2>&1 | tee /tmp/toolisle-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ToolIsle-build-diagnostics
          path: |
            /tmp/toolisle-tests.log
            /tmp/toolisle-build.log
            Package.resolved
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ToolIsle-macOS
          path: dist/ToolIsle-*.zip
          if-no-files-found: error
          retention-days: 14
