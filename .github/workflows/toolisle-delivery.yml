name: ToolIsle Delivery
on:
  push:
    branches: [dev, feat/toolisle-foundation]
    paths: ['ToolIsle/**', 'scripts/*toolisle*', 'Package.*', '.github/workflows/toolisle-delivery.yml']
  pull_request:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: toolisle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assemble branded foundation on development branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/toolisle-foundation'
        run: |
          python3 -m pip install CairoSVG==2.7.1 Pillow==11.3.0
          python3 scripts/prepare-toolisle.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Workflow changes are reviewed and applied through the authorized connector,
          # never through the narrower GITHUB_TOKEN available to this job.
          git add -A -- . ':!.github/workflows'
          if ! git diff --cached --quiet; then
            git commit -m 'build: assemble ToolIsle assets and isolate upstream runtime'
            git push origin HEAD:feat/toolisle-foundation
          fi
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Archive actual source revision
        run: git archive --format=tar.gz -o /tmp/ToolIsle-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ToolIsle-source
          path: /tmp/ToolIsle-source.tar.gz
          retention-days: 14
  core-tests:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - run: swift --version
      - run: swift test --parallel
  macos-build:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Test and package
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee /tmp/toolisle-tests.log
          bash scripts/build-toolisle.sh release 2>&1 | tee /tmp/toolisle-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ToolIsle-build-diagnostics
          path: |
            /tmp/toolisle-tests.log
            /tmp/toolisle-build.log
            Package.resolved
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ToolIsle-macOS
          path: dist/ToolIsle-*.zip
          if-no-files-found: error
          retention-days: 14
