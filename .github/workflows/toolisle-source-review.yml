name: ToolIsle source review
on:
  push:
    branches: [feat/toolisle-foundation]
    paths: [.github/workflows/toolisle-source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source for implementation review
        run: git archive --format=tar.gz -o /tmp/toolisle-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: toolisle-source-review
          path: /tmp/toolisle-source.tar.gz
          retention-days: 1
