name: ToolIsle source review
on:
  push:
    branches: [feat/toolisle-foundation]
    paths: [.github/workflows/toolisle-source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source and staged foundation payload
        run: |
          git archive --format=tar.gz -o /tmp/toolisle-source.tar.gz HEAD
          cp .github/toolisle-foundation.1.b64 /tmp/toolisle-foundation.1.b64
      - uses: actions/upload-artifact@v4
        with:
          name: toolisle-source-review
          path: |
            /tmp/toolisle-source.tar.gz
            /tmp/toolisle-foundation.1.b64
          retention-days: 1
