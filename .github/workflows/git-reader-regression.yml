name: Git repository reader regression
on:
  push:
    branches: [feat/git-repository-aggregate-reader]
  pull_request:
    paths:
      - 'DynamicIsland/ToolIsleFeatures/Gitee/**'
      - 'tests/*Reader*'
      - 'tests/*Git*'
      - 'scripts/test_git_reader.sh'
      - '.github/workflows/git-reader-regression.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export revision for offline review
        run: git archive --format=tar.gz HEAD > git-reader-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: git-reader-source
          path: git-reader-source.tar.gz
          retention-days: 3
  regression:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run reader regressions
        run: |
          if test -f scripts/test_git_reader.sh; then
            bash scripts/test_git_reader.sh
          else
            echo 'Regression suite is being added on this implementation branch.'
          fi
